service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: Dựa trên baseline (latency P95 bình thường khoảng 400-700ms), ngưỡng 3000ms phản ánh trải nghiệm người dùng chấp nhận được và phát hiện kịp thời các sự cố nghẽn mạng/RAG chậm. Error budget cho phép tối đa 0.5% request vi phạm hoặc thất bại trong chu kỳ 28 ngày.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
